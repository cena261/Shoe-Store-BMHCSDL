spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@//localhost:${ORACLE_PORT:1522}/xepdb1
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
#        dialect: org.hibernate.dialect.Oracle12cDialect
        timezone:
          default_storage: NORMALIZE
        jdbc:
          time_zone: UTC+7
        type:
          preferred_instant_jdbc_type: TIMESTAMP

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
